plugins {
    id "com.android.application"
}

android {
    namespace "com.syriatraders.tv"
    compileSdk 35

    defaultConfig {
        applicationId "com.syriatraders.tv"
        // Android 5.0+: every Android TV / Google TV set, old and new.
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs by sideloading
            // without a keystore in the repo. It is never published to a store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
