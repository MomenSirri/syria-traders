name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies (all three lockfiles)
        run: npm run install:ci

      - name: Unit and API tests
        run: npm test

      - name: Build client
        run: npm run build

      - name: Install Chromium for the pinned Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser tests (HTTPS host and smart-TV address, as run-game.bat)
        run: npm run test:browser

      - name: Browser tests (HTTP host behind a TLS proxy, as a cloud preview)
        run: npm run test:browser
        env:
          HTTPS: "0"

      - name: Upload browser screenshots and server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            test-results/*.png
            test-results/*.log
          if-no-files-found: ignore
